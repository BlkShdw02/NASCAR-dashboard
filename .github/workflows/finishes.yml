name: refresh-finishes
on:
  schedule: [{cron: "0 9 * * 1"}]   # Mondays 09:00 UTC, after the weekend race
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python scripts/scrape_finishes.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/finishes.csv data/weather_cache.json
          git diff --staged --quiet || (git commit -m "update finishes" && git push)
