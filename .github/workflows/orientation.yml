name: derive-orientation
on: workflow_dispatch
permissions: {contents: write}
concurrency: {group: derive-orientation, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python scripts/derive_orientation.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add config
          git diff --staged --quiet && exit 0
          git commit -m "update track orientation"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
